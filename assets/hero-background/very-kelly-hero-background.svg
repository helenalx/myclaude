<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="vk-sparkle-pattern" width="116" height="116" patternUnits="userSpaceOnUse">
      <rect width="116" height="116" fill="#F0186B"/>
      <path d="M58,0 C68,40 76,48 116,58 C76,68 68,76 58,116 C48,76 40,68 0,58 C40,48 48,40 58,0 Z" fill="#DE0E5C" opacity="0.8"/>
    </pattern>

    <linearGradient id="vk-horizontal-depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3E85" stop-opacity="0.16"/>
      <stop offset="42%" stop-color="#FF3E85" stop-opacity="0"/>
      <stop offset="75%" stop-color="#8C0E52" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7A0B49" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="vk-vertical-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8FB4" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#FF8FB4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6E0A45" stop-opacity="0.22"/>
    </linearGradient>

    <radialGradient id="vk-text-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vk-corner-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#3A0730" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3A0730" stop-opacity="0.22"/>
    </radialGradient>

    <filter id="vk-blur-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="vk-blur-blob" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="vk-blur-cloud" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <path id="vk-sparkle" d="M0,-58 C10,-18 18,-10 58,0 C18,10 10,18 0,58 C-10,18 -18,10 -58,0 C-18,-10 -10,-18 0,-58 Z"/>

    <g id="vk-cloud">
      <ellipse cx="-70" cy="18" rx="72" ry="44"/>
      <ellipse cx="0" cy="-6" rx="92" ry="56"/>
      <ellipse cx="78" cy="16" rx="66" ry="40"/>
      <ellipse cx="14" cy="34" rx="82" ry="34"/>
    </g>

    <g id="vk-butterfly">
      <path d="M-6,-58 C-14,-78 -22,-80 -26,-70" fill="none" stroke="#1B0B4B" stroke-width="4" stroke-linecap="round"/>
      <path d="M6,-58 C14,-78 22,-80 26,-70" fill="none" stroke="#1B0B4B" stroke-width="4" stroke-linecap="round"/>
      <path d="M0,-52 C-14,-118 -108,-118 -128,-66 C-140,-32 -104,4 -50,-6 C-18,-12 0,-30 0,-52 Z" fill="#FFD23F" stroke="#1B0B4B" stroke-width="6"/>
      <path d="M0,-52 C14,-118 108,-118 128,-66 C140,-32 104,4 50,-6 C18,-12 0,-30 0,-52 Z" fill="#FFD23F" stroke="#1B0B4B" stroke-width="6"/>
      <path d="M0,-6 C-10,10 -66,30 -74,62 C-80,88 -46,98 -22,78 C-4,62 0,20 0,-6 Z" fill="#9B4FCE" stroke="#1B0B4B" stroke-width="6"/>
      <path d="M0,-6 C10,10 66,30 74,62 C80,88 46,98 22,78 C4,62 0,20 0,-6 Z" fill="#9B4FCE" stroke="#1B0B4B" stroke-width="6"/>
      <circle cx="-64" cy="-58" r="11" fill="#FFF7E8"/>
      <circle cx="64" cy="-58" r="11" fill="#FFF7E8"/>
      <path d="M0,-64 C-9,-30 -9,20 0,66 C9,20 9,-30 0,-64 Z" fill="#1B0B4B"/>
    </g>

    <g id="vk-note">
      <ellipse cx="0" cy="46" rx="16" ry="11" transform="rotate(-18 0 46)"/>
      <rect x="12" y="-56" width="7" height="100" rx="3.5"/>
      <path d="M19,-56 C48,-48 50,-24 32,-14 C44,-34 34,-46 19,-40 Z"/>
    </g>

    <g id="vk-flower">
      <g fill="currentColor" stroke="#1B0B4B" stroke-width="3">
        <ellipse cx="0" cy="-32" rx="17" ry="26"/>
        <ellipse cx="0" cy="32" rx="17" ry="26"/>
        <ellipse cx="-32" cy="0" rx="26" ry="17"/>
        <ellipse cx="32" cy="0" rx="26" ry="17"/>
        <ellipse cx="-23" cy="-23" rx="17" ry="26" transform="rotate(45 -23 -23)"/>
        <ellipse cx="23" cy="23" rx="17" ry="26" transform="rotate(45 23 23)"/>
      </g>
      <circle cx="0" cy="0" r="17" fill="#FFD23F" stroke="#1B0B4B" stroke-width="3"/>
    </g>

    <g id="vk-bow">
      <path d="M-14,0 C-14,-16 -30,-24 -60,-56 C-104,-102 -158,-96 -168,-54 C-176,-20 -142,4 -96,-6 C-58,-14 -22,-6 -14,0 Z" fill="#FF3E85" stroke="#1B0B4B" stroke-width="8"/>
      <path d="M14,0 C14,-16 30,-24 60,-56 C104,-102 158,-96 168,-54 C176,-20 142,4 96,-6 C58,-14 22,-6 14,0 Z" fill="#FF3E85" stroke="#1B0B4B" stroke-width="8"/>
      <path d="M-14,0 C-14,16 -30,24 -52,60 C-80,106 -60,146 -30,140 C-8,136 -6,90 -10,52 C-12,32 -14,14 -14,0 Z" fill="#FF3E85" stroke="#1B0B4B" stroke-width="8"/>
      <path d="M14,0 C14,16 30,24 52,60 C80,106 60,146 30,140 C8,136 6,90 10,52 C12,32 14,14 14,0 Z" fill="#FF3E85" stroke="#1B0B4B" stroke-width="8"/>
      <rect x="-24" y="-24" width="48" height="56" rx="16" fill="#FF3E85" stroke="#1B0B4B" stroke-width="8"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#vk-sparkle-pattern)"/>
  <rect width="1920" height="1080" fill="url(#vk-vertical-depth)"/>
  <rect width="1920" height="1080" fill="url(#vk-horizontal-depth)"/>
  <ellipse cx="560" cy="560" rx="620" ry="520" fill="url(#vk-text-glow)"/>

  <g filter="url(#vk-blur-blob)" opacity="0.9">
    <ellipse cx="1500" cy="260" rx="360" ry="300" fill="#FFFFFF" opacity="0.10"/>
    <ellipse cx="1250" cy="760" rx="340" ry="280" fill="#FFD23F" opacity="0.10"/>
    <ellipse cx="1820" cy="880" rx="320" ry="260" fill="#9B4FCE" opacity="0.10"/>
    <ellipse cx="1780" cy="380" rx="250" ry="210" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <g fill="#FFFFFF" opacity="0.55" filter="url(#vk-blur-cloud)">
    <use href="#vk-cloud" transform="translate(950,95) scale(0.65)"/>
    <use href="#vk-cloud" transform="translate(1180,140) scale(1.05)"/>
    <use href="#vk-cloud" transform="translate(1560,70) scale(0.85)"/>
    <use href="#vk-cloud" transform="translate(1860,190) scale(0.75)"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <circle cx="2010" cy="60" r="345" stroke="#FF4D6D" stroke-width="28" opacity="0.85"/>
    <circle cx="2010" cy="60" r="310" stroke="#FF9142" stroke-width="28" opacity="0.85"/>
    <circle cx="2010" cy="60" r="275" stroke="#FFD23F" stroke-width="28" opacity="0.85"/>
    <circle cx="2010" cy="60" r="240" stroke="#4ADE80" stroke-width="28" opacity="0.85"/>
    <circle cx="2010" cy="60" r="205" stroke="#38BDF8" stroke-width="28" opacity="0.85"/>
    <circle cx="2010" cy="60" r="170" stroke="#9B4FCE" stroke-width="28" opacity="0.85"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M930,300 C1080,210 1260,240 1420,180 C1520,142 1600,150 1660,120" stroke-width="6" opacity="0.28"/>
    <path d="M980,760 C1140,840 1340,860 1500,790 C1620,738 1720,760 1800,720" stroke-width="6" opacity="0.28"/>
    <path d="M880,520 C960,560 1000,610 970,660" stroke-width="6" opacity="0.22"/>
  </g>

  <g>
    <use href="#vk-butterfly" transform="translate(1210,430) rotate(-8) scale(1.25)"/>
    <use href="#vk-butterfly" transform="translate(1790,540) rotate(12) scale(0.95)"/>
    <use href="#vk-butterfly" transform="translate(1870,730) rotate(-16) scale(0.55)"/>
  </g>

  <g fill="#FFF7E8" opacity="0.9">
    <use href="#vk-note" transform="translate(1075,660) rotate(-12) scale(1.1)"/>
    <use href="#vk-note" transform="translate(1910,400) rotate(10) scale(0.85)"/>
    <use href="#vk-note" transform="translate(1010,410) rotate(6) scale(0.6)"/>
  </g>

  <g>
    <use href="#vk-flower" transform="translate(1560,985) scale(1.25)" color="#FF9142"/>
    <use href="#vk-flower" transform="translate(1710,1040) scale(0.9)" color="#9B4FCE"/>
    <use href="#vk-flower" transform="translate(1860,970) scale(1.05)" color="#FF4D6D"/>
    <use href="#vk-flower" transform="translate(1430,1060) scale(0.65)" color="#38BDF8"/>
    <use href="#vk-flower" transform="translate(1310,150) scale(0.45)" color="#FFD23F" opacity="0.9"/>
  </g>

  <use href="#vk-bow" transform="translate(1880,995) scale(0.62) rotate(-6)"/>

  <g fill="#FFFFFF">
    <use href="#vk-sparkle" transform="translate(880,140) scale(0.42)" opacity="0.55"/>
    <use href="#vk-sparkle" transform="translate(1040,260) scale(0.3)" opacity="0.5" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1310,340) scale(0.5)" opacity="0.6"/>
    <use href="#vk-sparkle" transform="translate(1470,470) scale(0.28)" opacity="0.55" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1640,300) scale(0.4)" opacity="0.6"/>
    <use href="#vk-sparkle" transform="translate(1130,560) scale(0.32)" opacity="0.5" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1950,250) scale(0.45)" opacity="0.55"/>
    <use href="#vk-sparkle" transform="translate(1720,650) scale(0.35)" opacity="0.55" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1560,600) scale(0.24)" opacity="0.45"/>
    <use href="#vk-sparkle" transform="translate(940,850) scale(0.36)" opacity="0.5" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1180,900) scale(0.26)" opacity="0.45"/>
    <use href="#vk-sparkle" transform="translate(1930,600) scale(0.3)" opacity="0.5"/>
    <use href="#vk-sparkle" transform="translate(1780,900) scale(0.34)" opacity="0.5" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1400,930) scale(0.22)" opacity="0.4"/>
    <use href="#vk-sparkle" transform="translate(1050,180) scale(0.24)" opacity="0.4" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(1900,1000) scale(0.28)" opacity="0.45"/>
    <use href="#vk-sparkle" transform="translate(70,90) scale(0.34)" opacity="0.32" fill="#FFD23F"/>
    <use href="#vk-sparkle" transform="translate(210,960) scale(0.3)" opacity="0.28"/>
    <use href="#vk-sparkle" transform="translate(50,560) scale(0.22)" opacity="0.22"/>
    <use href="#vk-sparkle" transform="translate(700,140) scale(0.4)" opacity="0.22"/>
    <use href="#vk-sparkle" transform="translate(300,940) scale(0.32)" opacity="0.2" fill="#FFD23F"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vk-corner-vignette)"/>
</svg>
